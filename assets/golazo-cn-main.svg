<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="bgGr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1310"/>
      <stop offset="100%" stop-color="#050c09"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="30%" stop-color="#00d4ff"/>
      <stop offset="70%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
    <linearGradient id="diagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
  </defs>

  <!-- Terminal frame -->
  <rect width="900" height="560" fill="url(#bgGr)" rx="10"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="36" fill="#13241c" rx="10"/>
  <rect x="0" y="20" width="900" height="16" fill="#13241c"/>
  <circle cx="16" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="36" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" text-anchor="middle" fill="#556b5f" font-size="12" font-family="Consolas,monospace">golazo-cn --mock</text>

  <!-- Diagonal background pattern (simulating real app) -->
  <g opacity="0.15">
    <line x1="0" y1="180" x2="300" y2="0" stroke="#00d4ff" stroke-width="1"/>
    <line x1="0" y1="220" x2="340" y2="0" stroke="#ff4444" stroke-width="1"/>
    <line x1="40" y1="300" x2="340" y2="40" stroke="#00d4ff" stroke-width="1"/>
    <line x1="100" y1="360" x2="360" y2="100" stroke="#ff4444" stroke-width="1"/>
    <line x1="560" y1="360" x2="900" y2="100" stroke="#00d4ff" stroke-width="1"/>
    <line x1="600" y1="400" x2="900" y2="140" stroke="#ff4444" stroke-width="1"/>
    <line x1="640" y1="440" x2="900" y2="180" stroke="#00d4ff" stroke-width="1"/>
  </g>

  <!-- ASCII Art Logo (top center) -->
  <g font-family="Consolas,monospace" font-size="15">
    <!-- G -->
    <text x="180" y="72" fill="#00d4ff">╱╱╱╱</text>
    <text x="180" y="90" fill="#00d4ff">╱╱╱╱</text>
    <text x="180" y="108" fill="#00d4ff">╱╱╱╱</text>
    <text x="180" y="126" fill="#00d4ff">╱╱╱╱</text>
    <!-- O -->
    <text x="270" y="72" fill="#00d4ff">▄▀▀▀▀</text>
    <text x="270" y="90" fill="#00d4ff">█   ▀█</text>
    <text x="270" y="108" fill="#00d4ff"> ▀▀▀▀</text>
    <!-- L -->
    <text x="380" y="72" fill="#ff5555">▄▀▀▀▄</text>
    <text x="380" y="90" fill="#ff5555">█   █</text>
    <text x="380" y="108" fill="#ff5555"> ▀▀▀</text>
    <!-- A -->
    <text x="480" y="72" fill="#ff4444">█</text>
    <text x="480" y="90" fill="#ff4444">█</text>
    <text x="480" y="108" fill="#ff4444">▀▀</text>
    <!-- Z -->
    <text x="580" y="72" fill="#00d4ff">▄▀▀▀▀▀▄</text>
    <text x="580" y="90" fill="#00d4ff">█▀▀▀▀▀▀▀█</text>
    <text x="580" y="108" fill="#00d4ff">▀       ▀</text>
    <!-- O -->
    <text x="670" y="72" fill="#ff5555">▀▀▀▀█</text>
    <text x="670" y="90" fill="#ff5555"> █▀▀</text>
    <text x="670" y="108" fill="#ff5555">▀▀▀▀▀</text>
    <!-- dev badge -->
    <text x="770" y="72" fill="#00d4ff">▄</text>
    <text x="770" y="90" fill="#00d4ff">█</text>
    <text x="770" y="108" fill="#00d4ff"> ▀</text>
    <text x="790" y="108" fill="#00d4ff">dev</text>
  </g>

  <!-- Diagonal lines decoration -->
  <g opacity="0.3" font-family="Consolas,monospace" font-size="15">
    <text x="180" y="126" fill="#00d4ff">╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱</text>
    <text x="180" y="144" fill="#ff4444">╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱</text>
  </g>

  <!-- Dev Banner -->
  <rect x="280" y="168" width="340" height="26" fill="#1a2d25" rx="4" opacity="0.9"/>
  <text x="450" y="185" text-anchor="middle" fill="#ffbd2e" font-size="12" font-family="Consolas,monospace">[开发版] 当前是开发版本</text>

  <!-- Menu Items -->
  <!-- Item 1: 已完赛 (highlighted/selected) -->
  <rect x="330" y="220" width="240" height="36" fill="#1a3a2a" rx="4"/>
  <text x="450" y="244" text-anchor="middle" fill="#00d4ff" font-size="18" font-family="Consolas,monospace">▶ 已完赛</text>

  <!-- Item 2: 实时比赛 -->
  <text x="450" y="290" text-anchor="middle" fill="#7a9b88" font-size="18" font-family="Consolas,monospace">  实时比赛</text>

  <!-- Item 3: 设置 -->
  <text x="450" y="330" text-anchor="middle" fill="#7a9b88" font-size="18" font-family="Consolas,monospace">  设置</text>

  <!-- Footer help -->
  <text x="450" y="490" text-anchor="middle" fill="#3a4d42" font-size="11" font-family="Consolas,monospace">↑/↓：导航  Enter：选择  q：退出</text>

  <!-- Status bar -->
  <rect x="0" y="540" width="900" height="20" fill="#0d1713" rx="0"/>
  <text x="12" y="554" fill="#3a4d42" font-size="10" font-family="Consolas,monospace">golazo-cn dev | mock mode | 中文版</text>
  <text x="880" y="554" text-anchor="end" fill="#3a4d42" font-size="10" font-family="Consolas,monospace">1/3</text>
</svg>
