<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a16"/>
      <stop offset="100%" stop-color="#0a1310"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d25"/>
      <stop offset="100%" stop-color="#14241d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="540" fill="url(#bg)" rx="8"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="38" fill="url(#header)" rx="8"/>
  <rect x="0" y="20" width="900" height="18" fill="url(#header)"/>
  <circle cx="14" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="34" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="54" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" fill="#7a8b82" font-size="12" font-family="monospace">golazo-cn · 足球实时比分</text>

  <!-- Left Panel -->
  <rect x="12" y="48" width="260" height="480" fill="#0d1713" rx="4" opacity="0.8"/>
  <rect x="12" y="48" width="260" height="32" fill="#16241c" rx="4"/>
  <text x="24" y="69" fill="#f5b642" font-size="13" font-family="monospace" font-weight="bold">⚽ 比赛列表</text>
  <text x="250" y="69" text-anchor="end" fill="#4a5e53" font-size="11" font-family="monospace">/ 筛选</text>

  <!-- Match 1 - highlighted -->
  <rect x="12" y="80" width="260" height="46" fill="#1a3728" opacity="0.9"/>
  <text x="24" y="98" fill="#79c7a4" font-size="11" font-family="monospace">🏴󠁧󠁢󠁥󠁮󠁧󠁿 英超</text>
  <text x="250" y="98" text-anchor="end" fill="#5b8a6f" font-size="11" font-family="monospace">67'</text>
  <text x="24" y="114" fill="#ffffff" font-size="13" font-family="monospace" font-weight="bold">曼城 <tspan fill="#f5b642">2 : 1</tspan> 阿森纳</text>

  <!-- Match 2 -->
  <text x="24" y="144" fill="#79c7a4" font-size="11" font-family="monospace">🇪🇸 西甲</text>
  <text x="250" y="144" text-anchor="end" fill="#5b8a6f" font-size="11" font-family="monospace">32'</text>
  <text x="24" y="160" fill="#d0d9d3" font-size="13" font-family="monospace">皇马 <tspan fill="#f5b642">0 : 0</tspan> 巴萨</text>

  <!-- Match 3 -->
  <text x="24" y="190" fill="#79c7a4" font-size="11" font-family="monospace">🇩🇪 德甲</text>
  <text x="250" y="190" text-anchor="end" fill="#5b8a6f" font-size="11" font-family="monospace">FT</text>
  <text x="24" y="206" fill="#6b7a72" font-size="13" font-family="monospace">拜仁 <tspan fill="#f5b642">3 : 0</tspan> 多特蒙德</text>

  <!-- Match 4 -->
  <text x="24" y="236" fill="#79c7a4" font-size="11" font-family="monospace">🇮🇹 意甲</text>
  <text x="250" y="236" text-anchor="end" fill="#5b8a6f" font-size="11" font-family="monospace">58'</text>
  <text x="24" y="252" fill="#d0d9d3" font-size="13" font-family="monospace">AC米兰 <tspan fill="#f5b642">1 : 1</tspan> 尤文图斯</text>

  <!-- Footer -->
  <text x="24" y="520" fill="#4a5e53" font-size="10" font-family="monospace">↑↓ 导航 | Enter 详情 | r 刷新 | q 退出</text>

  <!-- Right Panel - Match Detail -->
  <rect x="284" y="48" width="604" height="480" fill="#0d1713" rx="4" opacity="0.8"/>
  <rect x="284" y="48" width="604" height="32" fill="#16241c" rx="4"/>
  <text x="296" y="69" fill="#f5b642" font-size="13" font-family="monospace" font-weight="bold">📋 比赛详情</text>
  <text x="870" y="69" text-anchor="end" fill="#4a5e53" font-size="11" font-family="monospace">Tab 切换</text>

  <!-- Teams & Score -->
  <text x="586" y="115" text-anchor="middle" fill="#eef7ef" font-size="22" font-family="monospace" font-weight="bold">曼城 vs 阿森纳</text>
  <text x="586" y="160" text-anchor="middle" fill="#f5b642" font-size="36" font-family="monospace" font-weight="bold">2 : 1</text>
  <text x="586" y="180" text-anchor="middle" fill="#5b8a6f" font-size="12" font-family="monospace">67' · 伊蒂哈德球场 · 主裁判: 迈克尔·奥利弗</text>

  <!-- Events -->
  <text x="296" y="212" fill="#79c7a4" font-size="12" font-family="monospace" font-weight="bold">⚡ 比赛事件</text>

  <circle cx="304" cy="236" r="5" fill="#f5b642"/>
  <text x="316" y="240" fill="#f5b642" font-size="12" font-family="monospace">12' ⚽ 哈兰德 (德布劳内助攻) 1:0</text>

  <circle cx="304" cy="258" r="5" fill="#e74c3c"/>
  <text x="316" y="262" fill="#e74c3c" font-size="12" font-family="monospace">24' 🟨 罗德里 (曼城)</text>

  <circle cx="304" cy="280" r="5" fill="#f5b642"/>
  <text x="316" y="284" fill="#f5b642" font-size="12" font-family="monospace">45' ⚽ 萨卡 (点球) 1:1</text>

  <circle cx="304" cy="302" r="5" fill="#f5b642"/>
  <text x="316" y="306" fill="#f5b642" font-size="12" font-family="monospace">58' ⚽ 福登 (B席助攻) 2:1</text>

  <circle cx="304" cy="324" r="5" fill="#3498db"/>
  <text x="316" y="328" fill="#3498db" font-size="12" font-family="monospace">67' 🔄 多库 ↑ 格拉利什 ↓</text>

  <!-- Stats section -->
  <text x="296" y="364" fill="#79c7a4" font-size="12" font-family="monospace" font-weight="bold">📊 数据统计</text>

  <text x="296" y="386" fill="#8a9b91" font-size="11" font-family="monospace">控球率</text>
  <rect x="400" y="377" width="200" height="12" fill="#1a2d25" rx="3"/>
  <rect x="400" y="377" width="116" height="12" fill="#f5b642" rx="3"/>
  <text x="610" y="386" fill="#b8c9bf" font-size="11" font-family="monospace">58%</text>
  <text x="700" y="386" fill="#b8c9bf" font-size="11" font-family="monospace">42%</text>

  <text x="296" y="408" fill="#8a9b91" font-size="11" font-family="monospace">射门数</text>
  <rect x="400" y="399" width="200" height="12" fill="#1a2d25" rx="3"/>
  <rect x="400" y="399" width="140" height="12" fill="#f5b642" rx="3"/>
  <text x="610" y="408" fill="#b8c9bf" font-size="11" font-family="monospace">14</text>
  <text x="700" y="408" fill="#b8c9bf" font-size="11" font-family="monospace">8</text>

  <text x="296" y="430" fill="#8a9b91" font-size="11" font-family="monospace">射正</text>
  <rect x="400" y="421" width="200" height="12" fill="#1a2d25" rx="3"/>
  <rect x="400" y="421" width="120" height="12" fill="#f5b642" rx="3"/>
  <text x="610" y="430" fill="#b8c9bf" font-size="11" font-family="monospace">6</text>
  <text x="700" y="430" fill="#b8c9bf" font-size="11" font-family="monospace">3</text>

  <text x="296" y="452" fill="#8a9b91" font-size="11" font-family="monospace">角球</text>
  <rect x="400" y="443" width="200" height="12" fill="#1a2d25" rx="3"/>
  <rect x="400" y="443" width="160" height="12" fill="#f5b642" rx="3"/>
  <text x="610" y="452" fill="#b8c9bf" font-size="11" font-family="monospace">8</text>
  <text x="700" y="452" fill="#b8c9bf" font-size="11" font-family="monospace">4</text>

  <text x="296" y="474" fill="#8a9b91" font-size="11" font-family="monospace">犯规</text>
  <rect x="400" y="465" width="200" height="12" fill="#1a2d25" rx="3"/>
  <rect x="400" y="465" width="100" height="12" fill="#f5b642" rx="3"/>
  <text x="610" y="474" fill="#b8c9bf" font-size="11" font-family="monospace">10</text>
  <text x="700" y="474" fill="#b8c9bf" font-size="11" font-family="monospace">12</text>

  <!-- Tabs at bottom -->
  <rect x="296" y="502" width="80" height="18" fill="#f5b642" rx="3"/>
  <text x="336" y="515" text-anchor="middle" fill="#0a1310" font-size="10" font-family="monospace" font-weight="bold">事件</text>
  <text x="386" y="515" fill="#5b8a6f" font-size="10" font-family="monospace">数据</text>
  <text x="440" y="515" fill="#5b8a6f" font-size="10" font-family="monospace">积分榜</text>
  <text x="500" y="515" fill="#5b8a6f" font-size="10" font-family="monospace">阵容</text>
  <text x="556" y="515" fill="#5b8a6f" font-size="10" font-family="monospace">集锦</text>
</svg>
